name: Amer Tutor branch tests
on:
  push:
    branches: [chatgptv1]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check src/ai.js
          node --check src/payments.js
          node --check src/openai-adapter.js
          node --check public/portal.js
          node --check public/admin-marketplace.js
          node --check scripts/smoke-test.js
      - name: Regression tests
        run: npm test
        env:
          AI_MOCK: '1'
